[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deckontrol-host"
version = "0.1.0"
description = "Host input daemon for Steam Deckontrol — injects a virtual controller from networked Deck input."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "evdev>=1.6.1",
]

[project.scripts]
deckontrol-host = "deckontrol_host.__main__:main"

[tool.setuptools]
packages = ["deckontrol_host"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
